<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Graph · Control</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="9" cy="20" r="5" stroke="#3f86c9" stroke-width="2.4"/>
        <circle cx="31" cy="10" r="4.2" stroke="#2aa9a0" stroke-width="2.4"/>
        <circle cx="31" cy="30" r="4.2" stroke="#2aa9a0" stroke-width="2.4"/>
        <path d="M13.8 17.4 26.7 11.4M13.8 22.6 26.7 28.6" stroke="#465070" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div><div class="bt">Agent Graph</div><div class="bs">trading bot</div></div>
    </div>
    <nav>
      <a data-route="control" href="#control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7"/></svg> Control</a>
      <a data-route="agenda" href="#agenda" id="navAgenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> Agenda <span class="cnt"></span></a>
      <a data-route="portfolio" href="#portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Portfolio</a>
      <a data-route="profits" href="#profits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg> Profits &amp; P/L</a>
      <a data-route="accounts" href="#accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg> Accounts</a>
    </nav>
    <div class="side-foot">
      <div class="kv"><span>Model</span><b>Opus 5.0</b></div>
      <div class="kv"><span>Loop</span><span id="sfLoop"></span></div>
      <div class="kv"><span>Agents live</span><span id="sfAgents" class="mono">0</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="pageTitle">Control</h1>
        <div class="grow"></div>
        <span class="live"><span id="liveDot" class="ld"></span><span id="liveText">—</span></span>
        <button id="themeBtn" class="iconbtn" title="Toggle light / dark" onclick="toggleTheme()"></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
